<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Droguería Ermita - Catálogo de Productos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <h1>Droguería Ermita</h1>
  </header>

  <main class="container">
    <p class="demo-notice">
      Catálogo de demostración: los precios y existencias son de ejemplo y el carrito no descuenta inventario real.
    </p>

    <section class="controls" aria-label="Controles de búsqueda, filtrado y orden">
      <div class="control-group">
        <label for="searchInput">Buscar producto</label>
        <input type="search" id="searchInput" placeholder="Ej. Vitamina, Analgésico...">
      </div>

      <div class="control-group">
        <label for="categoryFilter">Categoría</label>
        <select id="categoryFilter">
          <option value="all">Todas las categorías</option>
          <!-- Las opciones se generan por JS a partir de los datos -->
        </select>
      </div>

      <div class="control-group">
        <label for="statusFilter">Disponibilidad</label>
        <select id="statusFilter">
          <option value="all">Cualquier disponibilidad</option>
          <option value="available">Disponible</option>
          <option value="low">Stock bajo</option>
          <option value="out">Agotado</option>
        </select>
      </div>

      <div class="control-group">
        <label for="sortSelect">Ordenar por</label>
        <select id="sortSelect">
          <option value="nombre-asc">Nombre (A-Z)</option>
          <option value="nombre-desc">Nombre (Z-A)</option>
          <option value="precio-asc">Precio (menor a mayor)</option>
          <option value="precio-desc">Precio (mayor a menor)</option>
          <option value="disponibilidad">Disponibilidad</option>
        </select>
      </div>

      <p class="results-count" id="resultsCount" aria-live="polite">Cargando productos...</p>
    </section>

    <section class="grid" id="productGrid" aria-label="Catálogo de productos">
      <!-- Las tarjetas de producto se insertan aquí -->
    </section>
  </main>

  <!-- Modal de detalle de producto -->
  <div class="modal-overlay" id="productModal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Detalle del producto</h2>
        <button class="modal-close" id="closeModalBtn" aria-label="Cerrar detalle">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- El detalle del producto se inyecta aquí -->
      </div>
    </div>
  </div>

  <!-- Modal del carrito de demostración -->
  <div class="modal-overlay" id="cartModal" aria-hidden="true" role="dialog" aria-labelledby="cartModalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="cartModalTitle">Carrito de demostración</h2>
        <button class="modal-close" id="closeCartBtn" aria-label="Cerrar carrito">&times;</button>
      </div>
      <div class="modal-body" id="cartBody">
        <!-- El contenido del carrito se inyecta aquí -->
      </div>
    </div>
  </div>

  <!-- Botón flotante del carrito: siempre visible abajo a la derecha -->
  <button
    type="button"
    id="cartButton"
    class="cart-button"
    aria-haspopup="dialog"
    aria-label="Abrir carrito de compras de demostración"
  >
    🛒 Carrito
    <span id="cartCount" class="cart-count" aria-hidden="true">0</span>
  </button>

  <!-- Notificaciones breves (no bloquean la pantalla) -->
  <div id="toastContainer" class="toast-container" aria-hidden="true"></div>

  <div id="liveRegion" class="visually-hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
